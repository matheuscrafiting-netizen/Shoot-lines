name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Publica apenas a branch padrão do repositório
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar site
        run: |
          mkdir -p _site/fonts
          cp index.html game.js platform.js privacidade.html _site/
          cp fonts/* _site/fonts/
          # muda o endereço dos scripts a cada versão para o navegador não usar o antigo do cache
          sed -i "s|src=\"game.js\"|src=\"game.js?v=${GITHUB_SHA::7}\"|; s|src=\"platform.js\"|src=\"platform.js?v=${GITHUB_SHA::7}\"|" _site/index.html
          grep -q "game.js?v=" _site/index.html
          grep -q "platform.js?v=" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
