name: Testes do jogo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Robô joga partidas
        run: node tests/smoke.cjs
      - name: Montar pacote para o CrazyGames
        run: bash tools/build-crazygames.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shoot-lines-crazygames
          path: dist/crazygames/
