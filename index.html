<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Shoot Lines</title>
  <style>
    /* Lilita One (SIL Open Font License, ver fonts/OFL.txt), embutida no jogo */
    @font-face {
      font-family: 'Lilita One';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/lilita-one-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Lilita One';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/lilita-one-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #10162f;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      box-shadow: 0 0 40px rgba(0, 0, 0, .6);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <script src="platform.js"></script>
  <script src="game.js"></script>
</body>
</html>
